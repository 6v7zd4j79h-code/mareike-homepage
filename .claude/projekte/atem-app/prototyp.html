<title>Atem-App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EAF0EE; --surface:#F7FAF9; --ink:#1D2A29; --muted:#5B6C6A; --line:#CBD8D5;
  --breath:#7FA8B3; --breath-2:#B9D3D8; --accent:#8A566B; --accent-ink:#FFFFFF;
  --sos:#8A566B; --soft:#DDE8E5;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101B1B; --surface:#172525; --ink:#E3ECEA; --muted:#98ABA8; --line:#2A3D3C;
    --breath:#6E9DA8; --breath-2:#2E4C51; --accent:#CFA2B5; --accent-ink:#1E1219;
    --sos:#CFA2B5; --soft:#1D2F2E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101B1B; --surface:#172525; --ink:#E3ECEA; --muted:#98ABA8; --line:#2A3D3C;
  --breath:#6E9DA8; --breath-2:#2E4C51; --accent:#CFA2B5; --accent-ink:#1E1219;
  --sos:#CFA2B5; --soft:#1D2F2E;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--breath);outline-offset:2px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* Home */
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
header.top h1{font-size:28px}
header.top .tag{font-size:14px;color:var(--muted);font-style:italic}
.sos{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;border-radius:22px;padding:18px 20px;background:var(--sos);color:var(--accent-ink)}
.sos .dot{flex:none;width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);position:relative}
.sos .dot::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--accent-ink);animation:pulse 4s ease-in-out infinite}
.sos strong{display:block;font-family:var(--display);font-size:20px;font-weight:600}
.sos span{font-size:14px;opacity:.9}
@keyframes pulse{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}

.ask h2{font-size:22px;margin-bottom:12px}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.mood{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:15px}
.mood[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.rec{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:16px;padding:14px 16px}
.rec p{font-size:15px}
.rec b{font-family:var(--display);font-weight:600}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:var(--ground);font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.group{display:flex;flex-direction:column;gap:10px}
.group > .label{margin-bottom:2px}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ex h3{font-size:17px}
.ex p{grid-column:1;font-size:14px;color:var(--muted)}
.ex .len{grid-row:1 / span 2;grid-column:2;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.ex.soon{opacity:.62;cursor:default}
.ex.soon .len{font-style:italic}
.history{display:flex;flex-direction:column;gap:6px}
.history div{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);padding-block:6px}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* Player */
.player{display:flex;flex-direction:column;gap:22px;align-items:stretch}
.player .back{align-self:flex-start;border:0;background:none;color:var(--muted);padding:0;font-size:15px}
.player h2{font-size:26px}
.player .intro{color:var(--muted)}
.check{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.check label{font-weight:600}
.scale{display:flex;align-items:center;gap:12px}
.scale input{flex:1;accent-color:var(--accent)}
.scale output{font-family:var(--display);font-size:24px;width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.stage{position:relative;aspect-ratio:1;max-width:100%;width:min(100%,340px);margin:0 auto;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--line)}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--breath-2),var(--breath) 70%);transform:scale(.5);will-change:transform}
.cue{position:relative;text-align:center;display:flex;flex-direction:column;gap:4px;padding:0 18%}
.cue .phase{font-family:var(--display);font-size:30px;font-weight:600;color:var(--ink)}
.cue .count{font-size:40px;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1}
.hint{text-align:center;min-height:3em;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.controls{display:flex;gap:10px;justify-content:center}
.result{display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--display);font-size:40px;font-variant-numeric:tabular-nums}
.result small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.result .arrow{color:var(--muted);font-size:26px}
@media (prefers-reduced-motion: reduce){.sos .dot::after{animation:none}}
</style>

<div class="app" id="app"></div>

<script>
const EX = {
  sos:{area:"Runterkommen",name:"Notfallatmung",short:"Wenn alles zu viel ist. Doppelt einatmen, lang ausatmen.",
    intro:"Für die Momente, in denen es kocht: Kinder, Termine, Lärm. Zweimal einatmen, dann lang und langsam ausatmen. Schon wenige Runden bremsen dein Nervensystem.",
    rounds:10,phases:[["ein",3,"Durch die Nase einatmen"],["ein2",1,"Noch ein kleiner Atemzug obendrauf"],["aus",7,"Lang durch den Mund ausatmen"]]},
  balance:{area:"Runterkommen",name:"Balance-Atmung",short:"Gleich lang ein und aus. Bringt dich in deine Mitte.",
    intro:"Ein- und Ausatmen werden gleich lang. Etwa sechs Atemzüge pro Minute bringen Herz und Atem in einen ruhigen Takt.",
    rounds:18,phases:[["ein",5,"Weich in den Bauch einatmen"],["aus",5,"Genauso weich ausatmen"]]},
  schlaf:{area:"Schlafen",name:"Einschlafbegleitung",short:"4-7-8, wenn der Kopf nicht abschalten will.",
    intro:"Leg dich bequem hin. Vier Sekunden ein, sieben halten, acht aus. Das lange Ausatmen sagt deinem Körper: Der Tag ist vorbei.",
    rounds:6,phases:[["ein",4,"Leise durch die Nase einatmen"],["halten",7,"Sanft halten, nicht pressen"],["aus",8,"Ganz langsam ausatmen"]]},
  wach:{area:"Energie",name:"Sanft wach werden",short:"Mehr Energie ohne Feueratmung. Tief ein, kurz aus.",
    intro:"Eine sanfte Alternative zur Feueratmung: Du atmest tief und voll ein, hältst kurz und lässt locker los. Du wirst wacher, ohne dich zu pushen.",
    rounds:15,phases:[["ein",4,"Tief und voll einatmen"],["halten",2,"Kurz oben bleiben"],["aus",3,"Locker loslassen"]]},
  gehen:{area:"Unterwegs",name:"Atmen beim Gehen",short:"Atem und Schritte im gleichen Takt.",
    intro:"Geh in deinem Tempo. Vier Schritte einatmen, vier Schritte ausatmen. Die App zählt mit, etwa ein Schritt pro Sekunde.",
    rounds:20,unit:"Schritt",phases:[["ein",4,"Vier Schritte einatmen"],["aus",4,"Vier Schritte ausatmen"]]},
  check:{area:"Grundlagen",name:"Atem-Check",short:"Wie atmest du eigentlich? Fehlatmung erkennen.",
    intro:"Leg eine Hand auf die Brust und eine auf den Bauch. Du musst nichts verändern, nur beobachten.",
    rounds:1,phases:[["frei",20,"Atme ganz normal. Nur beobachten."],["frei",20,"Welche Hand hebt sich zuerst? Brust oder Bauch?"],["frei",20,"Atmest du durch Nase oder Mund? Hörbar oder leise?"],["ein",4,"Jetzt bewusst in die untere Hand atmen"],["aus",6,"Und lang ausatmen"],["ein",4,"Bauch weitet sich zuerst"],["aus",6,"Schultern bleiben unten"]]}
};
const SOON = [
  {area:"Weiblich & männlich",name:"Atmung für mehr Weiblichkeit",short:"Weich, rund, empfangend."},
  {area:"Weiblich & männlich",name:"Atmung für mehr Männlichkeit",short:"Klar, aufgerichtet, gerichtet."}
];
const MOODS = [
  ["Gestresst, alles zu viel","sos"],
  ["Kopf will nicht abschalten","schlaf"],
  ["Müde und schlapp","wach"],
  ["Nicht in meiner Mitte","balance"],
  ["Brauche Luft und Bewegung","gehen"],
  ["Weiß nicht, wie ich atme","check"]
];
const WORD = {ein:"Ein",ein2:"Noch mal ein",aus:"Aus",halten:"Halten",frei:"Beobachten"};
const app = document.getElementById("app");
let mood = null, run = null, wake = null;

const store = {
  get(){try{return JSON.parse(localStorage.getItem("atem-verlauf")||"[]")}catch(e){return []}},
  add(x){try{const h=store.get();h.unshift(x);localStorage.setItem("atem-verlauf",JSON.stringify(h.slice(0,5)))}catch(e){}}
};
function total(e){return e.rounds*e.phases.reduce((s,p)=>s+p[1],0)}
function mins(s){return s<60?s+" Sek.":Math.round(s/60)+" Min."}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function home(){
  stop();
  const areas=[...new Set([...Object.values(EX).map(e=>e.area),...SOON.map(s=>s.area)])];
  const rec = mood ? EX[mood] : null;
  const hist = store.get();
  app.innerHTML = `
    <header class="top"><h1>Atem</h1><span class="tag">Atme deinen Schlüssel</span></header>
    <button class="sos" data-go="sos"><span class="dot" aria-hidden="true"></span>
      <span><strong>Notfallatmung</strong><span>Sofort runterkommen, 2 Minuten</span></span></button>
    <section class="ask">
      <h2>Wie geht es dir gerade?</h2>
      <div class="moods">${MOODS.map(([t,k])=>`<button class="mood" data-mood="${k}" aria-pressed="${mood===k}">${t}</button>`).join("")}</div>
      ${rec?`<div class="rec"><p>Das könnte dir jetzt guttun:<br><b>${rec.name}</b> · ${mins(total(rec))}</p><button class="btn" data-go="${mood}">Los</button></div>`:""}
    </section>
    ${areas.map(a=>`<section class="group"><span class="label">${a}</span>
      ${Object.entries(EX).filter(([,e])=>e.area===a).map(([k,e])=>`<button class="ex" data-go="${k}"><h3>${e.name}</h3><p>${e.short}</p><span class="len">${mins(total(e))}</span></button>`).join("")}
      ${SOON.filter(s=>s.area===a).map(s=>`<div class="ex soon"><h3>${s.name}</h3><p>${s.short}</p><span class="len">bald</span></div>`).join("")}
    </section>`).join("")}
    ${hist.length?`<section class="group"><span class="label">Deine letzten Übungen</span><div class="history">
      ${hist.map(h=>`<div><span>${esc(h.name)}</span><span>Anspannung ${h.vor} → ${h.nach}</span></div>`).join("")}</div></section>`:""}
    <p class="note">Hör auf deinen Körper. Wenn dir schwindelig wird, atme wieder normal. Bei Schwangerschaft, Herz-Kreislauf-Erkrankungen, Epilepsie oder psychischen Krisen sprich vorher mit deiner Ärztin oder deinem Arzt. Die Übungen ersetzen keine Behandlung.</p>`;
  app.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{mood=b.dataset.mood;home()});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>intro(b.dataset.go));
  window.scrollTo(0,0);
}

function scaleInput(id,label,val){
  return `<div class="check"><label for="${id}">${label}</label>
    <div class="scale"><input type="range" id="${id}" min="1" max="10" value="${val}"><output id="${id}-o">${val}</output></div>
    <div class="ends"><span>1 ganz ruhig</span><span>10 sehr angespannt</span></div></div>`;
}
function bindScale(id){const i=document.getElementById(id),o=document.getElementById(id+"-o");i.oninput=()=>o.textContent=i.value;return i}

function intro(k){
  const e=EX[k];
  app.innerHTML=`<div class="player">
    <button class="back" data-back>← Zurück</button>
    <div><span class="label">${e.area} · ${mins(total(e))}</span><h2>${e.name}</h2></div>
    <p class="intro">${e.intro}</p>
    ${scaleInput("vor","Wie angespannt bist du gerade?",6)}
    <button class="btn" id="start">Übung starten</button></div>`;
  app.querySelector("[data-back]").onclick=home;
  const v=bindScale("vor");
  document.getElementById("start").onclick=()=>play(k,+v.value);
  window.scrollTo(0,0);
}

function play(k,vor){
  const e=EX[k];
  app.innerHTML=`<div class="player">
    <button class="back" data-back>← Beenden</button>
    <div class="stage"><div class="ring"></div><div class="orb" id="orb"></div>
      <div class="cue"><span class="phase" id="phase">Bereit</span><span class="count" id="count"></span></div></div>
    <p class="hint" id="hint">Gleich geht es los.</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="controls"><button class="btn ghost" id="pause">Pause</button></div></div>`;
  app.querySelector("[data-back]").onclick=home;
  const orb=document.getElementById("orb"),ph=document.getElementById("phase"),ct=document.getElementById("count"),
        hint=document.getElementById("hint"),bar=document.getElementById("bar"),pb=document.getElementById("pause");
  const seq=[["frei",3,"Setz dich bequem hin und lass die Schultern sinken."]];
  for(let r=0;r<e.rounds;r++) seq.push(...e.phases);
  const dur=seq.reduce((s,p)=>s+p[1],0)*1000;
  const LO=.5,HI=1;
  let size=LO, idx=-1, from=LO, elapsed=0, last=performance.now(), paused=false;
  try{navigator.wakeLock?.request("screen").then(w=>wake=w).catch(()=>{})}catch(err){}
  pb.onclick=()=>{paused=!paused;pb.textContent=paused?"Weiter":"Pause";last=performance.now()};
  run={raf:0};
  function frame(now){
    if(!paused) elapsed+=now-last; last=now;
    let t=elapsed,i=0; while(i<seq.length&&t>=seq[i][1]*1000){t-=seq[i][1]*1000;i++}
    if(i>=seq.length){finish(k,vor);return}
    const [type,sec,text]=seq[i], p=t/(sec*1000);
    if(i!==idx){idx=i;from=size;
      ph.textContent=WORD[type]; hint.textContent=text;
      try{navigator.vibrate?.(type==="halten"?[30,60,30]:40)}catch(err){}}
    const target = type==="ein"?(HI-.08):type==="ein2"?HI:type==="aus"?LO:from;
    const ease = x=>.5-.5*Math.cos(Math.PI*x);
    if(type==="frei") size=LO+.06+.06*Math.sin(elapsed/900);
    else size=from+(target-from)*ease(p);
    orb.style.transform=`scale(${size})`;
    const left=Math.ceil(sec-t/1000);
    ct.textContent = e.unit&&type!=="frei" ? `${e.unit} ${Math.min(sec,Math.floor(t/1000)+1)}` : left;
    bar.style.width=(elapsed/dur*100).toFixed(2)+"%";
    run.raf=requestAnimationFrame(frame);
  }
  run.raf=requestAnimationFrame(frame);
}

function finish(k,vor){
  stop();
  const e=EX[k];
  app.innerHTML=`<div class="player">
    <div><span class="label">Geschafft</span><h2>Spür kurz nach.</h2></div>
    <p class="intro">Bleib noch einen Moment. Wie fühlt sich dein Körper jetzt an?</p>
    ${scaleInput("nach","Wie angespannt bist du jetzt?",Math.max(1,vor-2))}
    <button class="btn" id="save">Fertig</button></div>`;
  const n=bindScale("nach");
  document.getElementById("save").onclick=()=>{
    const nach=+n.value; store.add({name:e.name,vor,nach});
    app.innerHTML=`<div class="player">
      <div><span class="label">${e.name}</span><h2>${nach<vor?"Du bist ruhiger geworden.":nach===vor?"Gut, dass du dir die Zeit genommen hast.":"Heute war es nicht leicht. Das ist in Ordnung."}</h2></div>
      <div class="result"><span><small>Vorher</small>${vor}</span><span class="arrow">→</span><span><small>Nachher</small>${nach}</span></div>
      <div class="controls"><button class="btn ghost" id="again">Noch einmal</button><button class="btn" id="home">Zur Übersicht</button></div></div>`;
    document.getElementById("again").onclick=()=>intro(k);
    document.getElementById("home").onclick=home;
  };
}
function stop(){if(run){cancelAnimationFrame(run.raf);run=null}try{wake?.release()}catch(e){}wake=null}

mood="sos";
home();
</script>
